  <symbol id="i-mark-start" viewBox="0 0 24 24"><path d="M3.75 3.75h5v2.5h-2.5v11.5h2.5v2.5h-5z" fill="currentColor"/><path d="M11.5 6.75v10.5l8.25-5.25z" fill="currentColor"/></symbol>
  <symbol id="i-mark-end" viewBox="0 0 24 24"><path d="M20.25 3.75h-5v2.5h2.5v11.5h-2.5v2.5h5z" fill="currentColor"/><path d="M4.25 6.75v10.5l8.25-5.25z" fill="currentColor"/></symbol>
  <!-- Cut from / cut to: the start or end bracket beside a struck rule (a struck rule means removed). -->
  <symbol id="i-cut-from" viewBox="0 0 24 24"><path d="M3.75 3.75h5v2.5h-2.5v11.5h2.5v2.5h-5z" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M12.25 12h8M13.75 6.5l5 11"/></g></symbol>
  <symbol id="i-cut-to" viewBox="0 0 24 24"><path d="M20.25 3.75h-5v2.5h2.5v11.5h-2.5v2.5h5z" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M3.75 12h8M5.25 6.5l5 11"/></g></symbol>
  <symbol id="i-size-s" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/></symbol>
  <symbol id="i-size-m" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.25" fill="currentColor"/></symbol>
  <symbol id="i-size-l" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/></symbol>
