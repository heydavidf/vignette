# npm security fixes come from "Dependabot security updates" in the repository settings;
# version-update PRs for dependencies are deliberately off to avoid PR noise for a solo maintainer.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
